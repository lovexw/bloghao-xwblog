# 一次性工作流：生产库开启英文测试版 English 0.1（settings.edition='en'）。
# 生效后由下一个提交删除本文件；语言版本可随时在后台「设置 → 语言版本」切换或关闭，
# 英文版渲染异常会自动回退中文版（机制见 src/i18n.ts 与 index.ts enGuard）。
name: One-off enable English 0.1 beta (temporary)

on:
  push:
    branches: [main]

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable edition=en in production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute DB --remote --command "INSERT INTO settings (key, value) VALUES ('edition', 'en') ON CONFLICT(key) DO UPDATE SET value = 'en'"
          npx wrangler d1 execute DB --remote --command "SELECT key, value FROM settings WHERE key LIKE 'edition%'"
